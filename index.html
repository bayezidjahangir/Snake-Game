<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #080c14;
  color: white;
  font-family: Arial, sans-serif;
  padding: 15px;
}

.game {
  width: 100%;
  max-width: 520px;
  padding: 18px;
  background: #101725;
  border: 1px solid #26364a;
  border-radius: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

h1 {
  font-size: 25px;
  color: #40ffb5;
}

.score-box {
  display: flex;
  gap: 8px;
}

.score-item {
  background: #1b2939;
  padding: 8px 12px;
  border-radius: 10px;
  text-align: center;
}

.score-item small {
  display: block;
  color: #91a4bb;
  font-size: 10px;
  margin-bottom: 4px;
}

.score-item strong {
  color: #40ffb5;
  font-size: 17px;
}

.game-area {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 12px;
  background: #080e18;
  border: 1px solid #26364a;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #050a12df;
  text-align: center;
  padding: 20px;
}

.overlay.hidden {
  display: none;
}

.overlay-content h2 {
  font-size: 28px;
  color: #40ffb5;
  margin-bottom: 12px;
}

.overlay-content p {
  color: #a5b8cc;
  line-height: 1.6;
  margin-bottom: 20px;
}

button {
  border: none;
  cursor: pointer;
  font: inherit;
  font-weight: bold;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(0.94);
}

.primary {
  background: #40ffb5;
  color: #07140f;
  padding: 12px 25px;
  border-radius: 10px;
  font-size: 16px;
}

.controls {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 15px;
}

.control-btn {
  background: #1b2939;
  color: #40ffb5;
  border: 1px solid #30445b;
  padding: 12px 16px;
  border-radius: 10px;
}

.info {
  color: #7e92a9;
  font-size: 12px;
  text-align: center;
  margin-top: 15px;
}

.mobile-controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  max-width: 210px;
  margin: 20px auto 0;
}

.mobile-controls button {
  height: 52px;
  background: #1b2939;
  color: #40ffb5;
  border: 1px solid #30445b;
  border-radius: 12px;
  font-size: 23px;
  touch-action: manipulation;
}

.mobile-controls button:nth-child(1) {
  grid-column: 2;
}

.mobile-controls button:nth-child(2) {
  grid-column: 1;
  grid-row: 2;
}

.mobile-controls button:nth-child(3) {
  grid-column: 2;
  grid-row: 2;
}

.mobile-controls button:nth-child(4) {
  grid-column: 3;
  grid-row: 2;
}

.mobile-controls button:nth-child(5) {
  grid-column: 2;
  grid-row: 3;
}

@media (min-width: 650px) {
  .mobile-controls {
    display: none;
  }
}
</style>
</head>

<body>

<div class="game">

  <div class="header">
    <h1>NEON SNAKE</h1>

    <div class="score-box">
      <div class="score-item">
        <small>SCORE</small>
        <strong id="score">0</strong>
      </div>

      <div class="score-item">
        <small>BEST</small>
        <strong id="best">0</strong>
      </div>
    </div>
  </div>

  <div class="game-area">
    <canvas id="gameCanvas"></canvas>

    <div class="overlay" id="overlay">
      <div class="overlay-content">
        <h2 id="overlayTitle">NEON SNAKE</h2>
        <p id="overlayText">
          Collect food and grow your snake.<br>
          Avoid the walls and your own body.
        </p>
        <button class="primary" id="startBtn">
          START GAME
        </button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" id="pauseBtn">
      Ⅱ Pause
    </button>

    <button class="control-btn" id="restartBtn">
      ↻ Restart
    </button>
  </div>

  <div class="mobile-controls">
    <button data-dir="up">▲</button>
    <button data-dir="left">◀</button>
    <button data-dir="down">▼</button>
    <button data-dir="right">▶</button>
  </div>

  <p class="info">
    Arrow Keys / WASD to move · Space to Pause
  </p>

</div>

<script>
"use strict";

// =====================================
// CANVAS SETUP
// =====================================

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d", { alpha: false });

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("best");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const restartBtn = document.getElementById("restartBtn");

const GRID = 24;
const CELL = 20;
const BOARD = GRID * CELL;

const STEP_TIME = 1000 / 10;

let snake = [];
let food = { x: 12, y: 12 };

let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };

let score = 0;
let best = 0;

let running = false;
let gameOver = false;

let lastTime = 0;
let accumulator = 0;
let animationId = 0;

let foodPulse = 0;

// Prevents multiple turns before the next movement.
let turnQueued = false;

// =====================================
// HIGH SCORE
// =====================================

try {
  best = Number(localStorage.getItem("neonSnakeBest")) || 0;
} catch (error) {
  best = 0;
}

bestElement.textContent = best;

// =====================================
// CANVAS RESIZE
// =====================================

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();

  if (!rect.width || !rect.height) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);

  ctx.setTransform(
    canvas.width / BOARD,
    0,
    0,
    canvas.height / BOARD,
    0,
    0
  );

  drawGame();
}

window.addEventListener("resize", resizeCanvas);

// =====================================
// RESET GAME
// =====================================

function resetGame() {
  snake = [
    { x: 6, y: 12 },
    { x: 5, y: 12 },
    { x: 4, y: 12 },
    { x: 3, y: 12 }
  ];

  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };

  score = 0;
  accumulator = 0;
  lastTime = 0;
  foodPulse = 0;

  turnQueued = false;

  running = false;
  gameOver = false;

  scoreElement.textContent = score;
  pauseBtn.textContent = "Ⅱ Pause";

  spawnFood();
  drawGame();
}

// =====================================
// FOOD
// =====================================

function spawnFood() {
  let position;

  do {
    position = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
  } while (
    snake.some(segment =>
      segment.x === position.x &&
      segment.y === position.y
    )
  );

  food = position;
}

// =====================================
// FIXED DIRECTION CONTROLS
// =====================================

function changeDirection(x, y) {
  if (!running || gameOver) return;

  // Only one turn is allowed per movement.
  if (turnQueued) return;

  // Prevent reversing into the snake.
  if (
    x === -direction.x &&
    y === -direction.y
  ) {
    return;
  }

  nextDirection = { x, y };

  // Correctly lock the turn until the next step.
  turnQueued = true;
}

// =====================================
// KEYBOARD CONTROLS
// =====================================

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  const controls = {
    arrowup: [0, -1],
    w: [0, -1],

    arrowdown: [0, 1],
    s: [0, 1],

    arrowleft: [-1, 0],
    a: [-1, 0],

    arrowright: [1, 0],
    d: [1, 0]
  };

  if (controls[key]) {
    event.preventDefault();

    changeDirection(
      controls[key][0],
      controls[key][1]
    );
  }

  if (key === " ") {
    event.preventDefault();
    togglePause();
  }

  if (key === "enter" && !running) {
    startGame();
  }
});

// =====================================
// MOBILE CONTROLS
// =====================================

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();

    const directions = {
      up: [0, -1],
      down: [0, 1],
      left: [-1, 0],
      right: [1, 0]
    };

    const [x, y] = directions[button.dataset.dir];

    changeDirection(x, y);
  });
});

// =====================================
// START / PAUSE / RESTART
// =====================================

function startGame() {
  if (gameOver) {
    resetGame();
  }

  running = true;
  gameOver = false;

  overlay.classList.add("hidden");

  lastTime = 0;
  accumulator = 0;

  pauseBtn.textContent = "Ⅱ Pause";

  if (!animationId) {
    animationId = requestAnimationFrame(gameLoop);
  }
}

function togglePause() {
  if (gameOver) return;

  if (!running) {
    startGame();
    return;
  }

  running = false;

  overlay.classList.remove("hidden");

  overlayTitle.textContent = "PAUSED";
  overlayText.textContent = "Your snake is waiting.";

  startBtn.textContent = "RESUME";
  pauseBtn.textContent = "▶ Resume";
}

function endGame() {
  running = false;
  gameOver = true;

  overlay.classList.remove("hidden");

  overlayTitle.textContent = "GAME OVER";

  overlayText.innerHTML =
    "Final Score: " + score +
    "<br>Best Score: " + best;

  startBtn.textContent = "PLAY AGAIN";
}

startBtn.addEventListener("click", startGame);

pauseBtn.addEventListener("click", togglePause);

restartBtn.addEventListener("click", () => {
  resetGame();

  overlay.classList.remove("hidden");

  overlayTitle.textContent = "NEON SNAKE";
  overlayText.innerHTML =
    "Collect food and grow your snake.<br>" +
    "Avoid the walls and your own body.";

  startBtn.textContent = "START GAME";
});

// =====================================
// GAME LOGIC
// =====================================

function updateGame() {
  direction = { ...nextDirection };

  // Allow another turn after this movement.
  turnQueued = false;

  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // Wall collision
  if (
    head.x < 0 ||
    head.y < 0 ||
    head.x >= GRID ||
    head.y >= GRID
  ) {
    endGame();
    return;
  }

  const eating =
    head.x === food.x &&
    head.y === food.y;

  // The tail moves away unless food is eaten.
  const body = eating
    ? snake
    : snake.slice(0, -1);

  // Self collision
  if (
    body.some(segment =>
      segment.x === head.x &&
      segment.y === head.y
    )
  ) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score += 10;
    scoreElement.textContent = score;

    if (score > best) {
      best = score;
      bestElement.textContent = best;

      try {
        localStorage.setItem("neonSnakeBest", best);
      } catch (error) {
        // Continue without saved high score.
      }
    }

    spawnFood();
  } else {
    snake.pop();
  }
}

// =====================================
// DRAW BACKGROUND
// =====================================

function drawBackground() {
  ctx.fillStyle = "#080e18";
  ctx.fillRect(0, 0, BOARD, BOARD);

  ctx.strokeStyle = "#172536";
  ctx.lineWidth = 0.5;

  for (let i = 0; i <= GRID; i++) {
    const pos = i * CELL;

    ctx.beginPath();
    ctx.moveTo(pos, 0);
    ctx.lineTo(pos, BOARD);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, pos);
    ctx.lineTo(BOARD, pos);
    ctx.stroke();
  }
}

// =====================================
// DRAW FOOD
// =====================================

function drawFood() {
  const cx = food.x * CELL + CELL / 2;
  const cy = food.y * CELL + CELL / 2;

  const pulse = 1 + Math.sin(foodPulse) * 0.12;

  ctx.save();

  ctx.shadowColor = "#ff5577";
  ctx.shadowBlur = 12;
  ctx.fillStyle = "#ff5577";

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    CELL * 0.32 * pulse,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffd4dc";

  ctx.beginPath();
  ctx.arc(cx - 2, cy - 2, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// =====================================
// DRAW SNAKE
// =====================================

function drawSnake() {
  ctx.save();

  // Body
  for (let i = snake.length - 1; i >= 1; i--) {
    const segment = snake[i];

    const x = segment.x * CELL;
    const y = segment.y * CELL;

    const gradient = ctx.createLinearGradient(
      x, y, x + CELL, y + CELL
    );

    gradient.addColorStop(0, "#25d99a");
    gradient.addColorStop(1, "#087f68");

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.roundRect(
      x + 1.5,
      y + 1.5,
      CELL - 3,
      CELL - 3,
      5
    );

    ctx.fill();

    ctx.fillStyle = "#ffffff18";

    ctx.beginPath();

    ctx.roundRect(
      x + 4,
      y + 3,
      CELL - 8,
      3,
      2
    );

    ctx.fill();
  }

  // Head
  const head = snake[0];

  const hx = head.x * CELL;
  const hy = head.y * CELL;

  ctx.shadowColor = "#40ffb5";
  ctx.shadowBlur = 10;

  const gradient = ctx.createLinearGradient(
    hx, hy, hx + CELL, hy + CELL
  );

  gradient.addColorStop(0, "#8affd1");
  gradient.addColorStop(1, "#20d99a");

  ctx.fillStyle = gradient;

  ctx.beginPath();

  ctx.roundRect(
    hx + 1,
    hy + 1,
    CELL - 2,
    CELL - 2,
    6
  );

  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#061b17";

  let eye1, eye2;

  if (direction.x === 1) {
    eye1 = [hx + 14, hy + 5];
    eye2 = [hx + 14, hy + 14];
  } else if (direction.x === -1) {
    eye1 = [hx + 5, hy + 5];
    eye2 = [hx + 5, hy + 14];
  } else if (direction.y === -1) {
    eye1 = [hx + 5, hy + 5];
    eye2 = [hx + 14, hy + 5];
  } else {
    eye1 = [hx + 5, hy + 14];
    eye2 = [hx + 14, hy + 14];
  }

  [eye1, eye2].forEach(eye => {
    ctx.beginPath();
    ctx.arc(eye[0], eye[1], 2, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
}

// =====================================
// RENDER
// =====================================

function drawGame() {
  drawBackground();
  drawFood();
  drawSnake();
}

// =====================================
// GAME LOOP
// =====================================

function gameLoop(timestamp) {
  animationId = 0;

  if (!running) return;

  if (!lastTime) {
    lastTime = timestamp;
  }

  const delta = Math.min(timestamp - lastTime, 100);

  lastTime = timestamp;
  accumulator += delta;

  foodPulse += delta * 0.004;

  // Fixed movement speed, independent of FPS.
  while (accumulator >= STEP_TIME) {
    updateGame();

    accumulator -= STEP_TIME;

    if (!running) break;
  }

  drawGame();

  if (running) {
    animationId = requestAnimationFrame(gameLoop);
  }
}

// =====================================
// INITIALIZE
// =====================================

resetGame();
resizeCanvas();

</script>

</body>
</html>
