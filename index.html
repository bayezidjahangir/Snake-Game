<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game-container">

    <header>
        <h1>🐍 SNAKE ARCADE</h1>
        <p>Classic Game • Premium Edition</p>
    </header>

    <!-- Scoreboard -->
    <div class="stats">
        <div class="stat">
            <span>YOUR SCORE</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>HIGH SCORE</span>
            <strong id="best">0</strong>
        </div>
    </div>

    <!-- Settings -->
    <div class="settings">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
            <option value="150">Easy</option>
            <option value="105" selected>Normal</option>
            <option value="65">Hard</option>
        </select>

        <label for="theme">Theme</label>
        <select id="theme">
            <option value="green">Neon Green</option>
            <option value="blue">Cyber Blue</option>
            <option value="red">Neon Red</option>
        </select>
    </div>

    <!-- Game Board -->
    <div class="board-wrapper">
        <canvas id="game" width="400" height="400"></canvas>

        <div id="overlay" class="overlay">
            <h2 id="overlayTitle">READY?</h2>
            <p id="overlayText">Press Start to Play</p>
            <button id="startBtn">START GAME</button>
        </div>
    </div>

    <!-- Game Buttons -->
    <div class="game-buttons">
        <button id="pauseBtn">PAUSE</button>
        <button id="restartBtn">RESTART</button>
        <button id="soundBtn">SOUND: ON</button>
    </div>

    <!-- Mobile Controls -->
    <div class="mobile-controls">
        <button data-dir="up">▲</button>

        <div>
            <button data-dir="left">◀</button>
            <button data-dir="down">▼</button>
            <button data-dir="right">▶</button>
        </div>
    </div>

    <p class="instructions">
        Use Arrow Keys or WASD to move.
        Collect food and avoid collisions!
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
