<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle at top, #172b27, #080d0c 65%);
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
    text-align: center;
}

h1 {
    font-size: 35px;
    letter-spacing: 4px;
    color: #7dff9b;
    text-shadow: 0 0 15px #29ff65;
    margin-bottom: 8px;
}

.subtitle {
    color: #8baca0;
    margin-bottom: 25px;
    font-size: 12px;
    letter-spacing: 3px;
}

.score-box {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 18px;
}

.score {
    flex: 1;
    background: #111d19;
    border: 1px solid #285c3c;
    border-radius: 12px;
    padding: 13px;
    box-shadow: 0 0 12px #153d27;
}

.score p {
    color: #8baca0;
    font-size: 11px;
    margin-bottom: 7px;
    letter-spacing: 2px;
}

.score h2 {
    color: #7dff9b;
    font-size: 25px;
}

.game-board {
    position: relative;
    background: #09130f;
    border: 2px solid #40ff79;
    border-radius: 12px;
    padding: 5px;
    box-shadow: 0 0 20px #1cff58, inset 0 0 20px #143b23;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 7px;
}

.message {
    margin-top: 18px;
    color: #a5c7b2;
    font-size: 13px;
}

button {
    margin-top: 20px;
    background: linear-gradient(135deg, #39ff75, #12b84b);
    color: #06140a;
    border: none;
    border-radius: 25px;
    padding: 13px 35px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 15px #39ff75;
}

button:hover {
    transform: scale(1.05);
}

.game-over {
    position: absolute;
    inset: 5px;
    background: rgba(3, 12, 8, 0.92);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 7px;
}

.game-over h2 {
    color: #ff5252;
    font-size: 32px;
    margin-bottom: 10px;
}

.game-over p {
    color: white;
}
</style>
</head>

<body>

<div class="container">

    <h1>NEON SNAKE</h1>
    <p class="subtitle">CLASSIC ARCADE EXPERIENCE</p>

    <div class="score-box">
        <div class="score">
            <p>SCORE</p>
            <h2 id="score">0</h2>
        </div>

        <div class="score">
            <p>BEST SCORE</p>
            <h2 id="best">0</h2>
        </div>
    </div>

    <div class="game-board">

        <canvas id="game" width="400" height="400"></canvas>

        <div class="game-over" id="gameOver">
            <h2>GAME OVER</h2>
            <p>Better luck next time!</p>
            <button onclick="startGame()">PLAY AGAIN</button>
        </div>

    </div>

    <p class="message">Use ARROW KEYS or WASD to move</p>

    <button onclick="startGame()">RESTART GAME</button>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;

let snake, food, dx, dy, score, game;
let best = Number(localStorage.getItem("snakeBest")) || 0;

document.getElementById("best").innerText = best;

function startGame() {
    clearInterval(game);

    snake = [{x: 200, y: 200}];
    food = {x: 100, y: 100};

    dx = box;
    dy = 0;
    score = 0;

    document.getElementById("score").innerText = score;
    document.getElementById("gameOver").style.display = "none";

    draw();

    game = setInterval(update, 120);
}

function randomFood() {
    let position;

    do {
        position = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };
    } while (snake.some(part =>
        part.x === position.x && part.y === position.y
    ));

    return position;
}

function update() {

    let head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    let eating = head.x === food.x && head.y === food.y;

    let body = eating ? snake : snake.slice(0, -1);

    if (
        head.x < 0 || head.x >= canvas.width ||
        head.y < 0 || head.y >= canvas.height ||
        body.some(part => part.x === head.x && part.y === head.y)
    ) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (eating) {
        score += 10;

        document.getElementById("score").innerText = score;

        if (score > best) {
            best = score;
            localStorage.setItem("snakeBest", best);
            document.getElementById("best").innerText = best;
        }

        food = randomFood();
    } else {
        snake.pop();
    }

    draw();
}

function draw() {

    ctx.fillStyle = "#09130f";
    ctx.fillRect(0, 0, 400, 400);

    // Grid
    ctx.strokeStyle = "rgba(80,255,130,0.07)";
    ctx.lineWidth = 1;

    for (let i = 0; i <= 400; i += box) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, 400);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(400, i);
        ctx.stroke();
    }

    // Food
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff4444";
    ctx.fillStyle = "#ff4545";
    ctx.beginPath();
    ctx.arc(food.x + 10, food.y + 10, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Snake body
    snake.forEach((part, index) => {

        ctx.fillStyle = index === 0 ? "#8bffad" : "#24d65d";

        ctx.shadowBlur = index === 0 ? 15 : 5;
        ctx.shadowColor = "#39ff75";

        ctx.beginPath();
        ctx.roundRect(part.x + 1, part.y + 1, 18, 18, 5);
        ctx.fill();

        ctx.shadowBlur = 0;
    });

    // Eyes
    let head = snake[0];

    ctx.fillStyle = "#07140a";

    let eyes;

    if (dx > 0) {
        eyes = [[13, 5], [13, 13]];
    } else if (dx < 0) {
        eyes = [[3, 5], [3, 13]];
    } else if (dy < 0) {
        eyes = [[5, 3], [13, 3]];
    } else {
        eyes = [[5, 13], [13, 13]];
    }

    eyes.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(head.x + x, head.y + y, 2, 0, Math.PI * 2);
        ctx.fill();
    });
}

function endGame() {
    clearInterval(game);
    document.getElementById("gameOver").style.display = "flex";
}

document.addEventListener("keydown", function(e) {

    let key = e.key.toLowerCase();

    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        e.preventDefault();
    }

    if ((key === "arrowup" || key === "w") && dy === 0) {
        dx = 0;
        dy = -box;
    }

    else if ((key === "arrowdown" || key === "s") && dy === 0) {
        dx = 0;
        dy = box;
    }

    else if ((key === "arrowleft" || key === "a") && dx === 0) {
        dx = -box;
        dy = 0;
    }

    else if ((key === "arrowright" || key === "d") && dx === 0) {
        dx = box;
        dy = 0;
    }
});

startGame();

</script>

</body>
</html>
